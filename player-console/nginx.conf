server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'" always;
    add_header Permissions-Policy "serial=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
