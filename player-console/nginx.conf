user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    reset_timedout_connection on;
    gzip_static on;
    gzip_vary on;

    server {
        listen 8080 backlog=4096;
        server_name _;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'" always;
        add_header Permissions-Policy "serial=(self)" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }

        location ~ \.(css|js|svg)$ {
            expires 1h;
            try_files $uri =404;
        }
    }
}
