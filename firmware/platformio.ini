[platformio]
default_envs = esp32-s3-rev3

[env:esp32-s3-rev3]
extra_scripts = pre:scripts/load_secrets.py
build_src_filter = +<*> -<morse_adapter.cpp>
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  olikraus/U8g2 @ ^2.36.15

; HG-ESP32-S3 DevkitC-1: USB CDC to ESP-NOW, no badge peripherals/PSRAM.
[env:morse-bridge-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<morse_adapter.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
