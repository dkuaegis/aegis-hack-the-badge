[platformio]
default_envs = esp32-s3-rev3

[env:esp32-s3-rev3]
extra_scripts = pre:scripts/load_secrets.py
build_src_filter = +<*> -<morse_adapter.cpp> -<doom_badge.cpp> -<doom_music.cpp> -<badapple.cpp>
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  olikraus/U8g2 @ ^2.36.15

; Optional original Doom build. The default badge image and upload_all.py stay unchanged.
[env:esp32-s3-rev3-doom]
extends = env:esp32-s3-rev3
build_src_filter = +<*> -<morse_adapter.cpp> -<badapple.cpp>
board_build.partitions = doom_partitions.csv
board_build.filesystem = littlefs
build_flags =
  ${env:esp32-s3-rev3.build_flags}
  -DAEGIS_DOOM
  -DDOOM_PANEL_W=128
  -DDOOM_PANEL_H=64
  -DDOOM_VIEWPORT_W=128
  -DDOOM_VIEWPORT_H=64

; Bad Apple keeps the badge UI and uses a separate filesystem image from Doom.
[env:esp32-s3-rev3-badapple]
extends = env:esp32-s3-rev3
extra_scripts = pre:scripts/load_secrets.py, pre:scripts/badapple_data.py
build_src_filter = +<*> -<morse_adapter.cpp> -<doom_badge.cpp> -<doom_music.cpp>
board_build.partitions = doom_partitions.csv
board_build.filesystem = littlefs
build_flags =
  ${env:esp32-s3-rev3.build_flags}
  -DAEGIS_BADAPPLE

; HG-ESP32-S3 DevkitC-1: USB CDC to ESP-NOW, no badge peripherals/PSRAM.
[env:morse-bridge-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<morse_adapter.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
