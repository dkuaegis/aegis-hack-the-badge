<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS // GAME LEADERBOARD</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#030604;--panel:#07110b;--line:#245432;--green:#7dff9e;--dim:#769b80;--gold:#ffe46b;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#163c22,var(--bg) 48%);color:var(--green);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:clamp(18px,3vw,42px)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;max-width:1500px;margin:0 auto 24px;border-bottom:1px solid var(--line);padding-bottom:16px}h1{margin:0;font-size:clamp(24px,3vw,48px);letter-spacing:.08em}header p{margin:8px 0 0;color:var(--dim)}#live{color:var(--dim);text-align:right;white-space:nowrap}.online{color:var(--green)}.error{color:var(--red)}main{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,30px);max-width:1500px;margin:auto}.board{min-width:0;border:1px solid var(--line);background:rgba(5,12,8,.95);box-shadow:0 0 34px #063b1c}.board h2{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);font-size:clamp(18px,2vw,30px)}.head,.row{display:grid;grid-template-columns:64px minmax(130px,1fr) minmax(150px,1.2fr) 110px;align-items:center;gap:14px;padding:11px 20px}.head{color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)}.row{min-height:58px;border-bottom:1px solid #132d1c;font-size:clamp(14px,1.4vw,22px)}.row:last-child{border-bottom:0}.row.first{color:var(--gold);background:#312c0b55}.row.offline{opacity:.55}.rank{color:var(--dim)}.name{font-weight:900;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis}.device{color:var(--dim);overflow:hidden;text-overflow:ellipsis}.score{text-align:right;font-size:1.25em;font-weight:900}.empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:34px}@media(max-width:850px){main{grid-template-columns:1fr}.head,.row{grid-template-columns:48px minmax(100px,1fr) minmax(110px,1fr) 80px}header{align-items:flex-start;flex-direction:column}#live{text-align:left}}
</style>
<header>
  <div><h1>AEGIS // GAME LEADERBOARD</h1><p>HACK THE BADGE · LIVE SCORE FEED</p></div>
  <div id="live">CONNECTING...</div>
</header>
<main>
  <section class="board"><h2>FLAPPY HACKER // TOP 10</h2><div class="head"><span>RANK</span><span>NICKNAME</span><span>BADGE</span><span>SCORE</span></div><div id="flappy"></div></section>
  <section class="board"><h2>FIREWALL BREAKER // TOP 10</h2><div class="head"><span>RANK</span><span>NICKNAME</span><span>BADGE</span><span>SCORE</span></div><div id="firewall"></div></section>
</main>
<script>
let loading=false;
const uniqueId=id=>String(id||'').replace(/^AEGIS-/i,'');

function renderBoard(rootId,entries){
  const root=document.getElementById(rootId);
  root.replaceChildren();
  if(!entries.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='NO SCORES YET';root.append(empty);return}
  entries.slice(0,10).forEach((entry,index)=>{
    const row=document.createElement('div');
    row.className='row'+(index===0?' first':'')+(entry.online?'':' offline');
    const values=[String(index+1).padStart(2,'0'),String(entry.nickname).slice(0,10),uniqueId(entry.badgeId),String(entry.score)];
    values.forEach((value,column)=>{const cell=document.createElement(column===1?'strong':'span');cell.className=['rank','name','device','score'][column];cell.textContent=value;row.append(cell)});
    root.append(row);
  });
}

async function refresh(){
  if(loading)return;
  loading=true;
  const live=document.getElementById('live');
  try{
    const response=await fetch('/api/leaderboard',{cache:'no-store'});
    if(!response.ok)throw new Error(response.statusText);
    const data=await response.json();
    renderBoard('flappy',data.games.flappy);
    renderBoard('firewall',data.games.firewall);
    live.className='online';live.textContent=`LIVE // ${data.onlineBadges} BADGES // ${new Date().toLocaleTimeString('ko-KR',{hour12:false})}`;
  }catch(error){live.className='error';live.textContent='BRIDGE OFFLINE // RETRYING'}
  finally{loading=false}
}

setInterval(refresh,1000);
refresh();
</script>
</html>
